name: servicelog_ai
description: Plataforma ORION de registro técnico, histórico de falhas e assistência por IA.
publish_to: none
version: 0.4.0-alpha.2+13

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.0
  supabase_flutter: ^2.16.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite_common: ^2.5.6
  sqflite_common_ffi: ">=2.3.7 <2.4.0"
  sqflite_common_ffi_web: ^1.0.2
  sqlite3: ^2.9.4
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/orion-logo.jpg
    - assets/branding/orion-icon.png
