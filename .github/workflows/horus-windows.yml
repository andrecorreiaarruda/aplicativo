name: Horus — testes e executável Windows

on:
  push:
    paths:
      - "horus/**"
      - ".github/workflows/horus-windows.yml"
  pull_request:
    paths:
      - "horus/**"
      - ".github/workflows/horus-windows.yml"
  workflow_dispatch:

jobs:
  test:
    name: Testes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: horus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas do Qt (Linux)
        if: runner.os == 'Linux'
        # dcmtk: clientes e servidores de referência para os testes de
        # interoperabilidade da rede (tests/test_net_dcmtk.py).
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 dcmtk
      - run: python -m pip install -e ".[zip,dev]"
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  build-windows:
    name: Executável Windows
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: horus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[zip,build]"
      - run: python packaging/make_icon.py
      - run: python -m PyInstaller packaging/horus.spec --noconfirm --clean
      - name: Autoteste do executável empacotado
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Horus\Horus.exe -ArgumentList '--self-test', 'selftest.txt' -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (python -c "import horus; print(horus.__version__)").Trim()
          & $iscc "/DAppVersion=$version" packaging\horus.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Horus-windows
          path: |
            horus/dist/Horus/
            horus/dist/Horus-*-setup.exe
